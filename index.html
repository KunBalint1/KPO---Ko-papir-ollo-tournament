<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>KPOTournaments</title>
</head>
<body>
    <h1 class="title-animation">Ultimate KPO Tournament</h1>
    <img src="Coinstyle.webp" alt="Logo" class="Logo title-animation">
    <div class="ellenfelek">
        <button class="button-text" id="mcisti" style="display: none;">McIsti</button>
        <br>
        <button class="button-text" id="subi" style="display: none;">Subi Roland</button>
        <br>
        <button class="button-text" id="varga" style="display: none;">Varga Irén</button>
    </div>
    <div class="button-container">
        <div class="fade-in">
            <h1 class="button-text" id="egyjatekos">Egyjátékos</h1>
            <button id="myButton">Játék</button>
        </div>
        <div class="fade-in">
            <h1 class="button-text" id="tobbjatekos">Többjátékos</h1>
            <button id="myButton2">Játék</button>
        </div>
    </div>
    
    <script src="fadein.js"></script>
    <script src="ai-ellenfelek.js"></script>
    
</body>
</html>
